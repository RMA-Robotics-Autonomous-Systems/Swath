[workspace]
resolver = "2"
members = ["crates/swath-core", "crates/swath-cli", "crates/swath-app"]

# `cargo build` builds the library and the `swath` command, and nothing that
# needs a system library. The desktop shell links webkit2gtk, which is not
# installable everywhere and is a poor thing to discover on the first command
# in the README -- so it is opt-in, with `-p swath-app`. CI passes --workspace
# and still builds it.
default-members = ["crates/swath-core", "crates/swath-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/RMA-Robotics-Autonomous-Systems/Swath"

[workspace.dependencies]
swath-core = { path = "crates/swath-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
rayon = "1"
png = "0.17"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
anyhow = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Already in the tree through `png`; a direct dependency rather than a
# hand-rolled inflate, which would be 250 lines of risk for no gain.
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
